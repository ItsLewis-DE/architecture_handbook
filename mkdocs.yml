site_name: Data Engineering Field Notes
site_description: Ghi chú về kiến trúc và vận hành hệ thống dữ liệu

theme:
  name: material
  language: vi
  palette:
    primary: indigo
    accent: deep purple
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Data Architecture:
      - Shared-disk vs shared-nothing: architecture/shared-disk-vs-shared-nothing.md
  - Apache Airflow:
      - Architecture: airflow/architecture.md

markdown_extensions:
  - toc:
      toc_depth: 2-4
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/landing.css
  - stylesheets/article.css

extra_javascript:
  - javascripts/article-deck.js
  - javascripts/library-browser.js
